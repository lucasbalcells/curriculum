<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lucas Balcells – Roles</title>
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <header>
    <h1>Roles</h1>
    <p>Selected Work and Projects</p>
  </header>

  <div class="btn-container">
    <button class="btn-nav" onclick="window.location.href='index.html'">Back to Home</button>
  </div>

  <main>
    <section id="projects">
      <div class="role-buttons">
        <button onclick="showRole('jr')" id="btn-jr">Jr. AE</button>
        <button onclick="showRole('ae')" id="btn-ae">Account Executive</button>
        <button onclick="showRole('sr')" id="btn-sr">Sr. AE</button>
        <button onclick="showRole('website')" id="btn-website">Website Leader</button>
        <button onclick="showRole('spm')" id="btn-spm">Sr. Project Manager</button>
        <button onclick="showRole('director')" id="btn-director">Account Director</button>
        <button onclick="showRole('superside')" id="btn-superside" class="active">Sr. Creative PM</button>
      </div>
      <div id="project-content"></div>
    </section>
    <section id="contact">
      <h2>Contact</h2>
      <p>Email: <a href="mailto:balcellslucasn@gmail.com">balcellslucasn@gmail.com</a></p>
      <p>Website: <a href="https://lucasbalcells.github.io/curriculum/index.html" target="_blank" rel="noopener">www.lucasbalcells.com</a></p>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Lucas Balcells</p>
  </footer>

  <script>
    const content = {
      jr: `<h2>Jr. Account Executive – JWT</h2><div class="project-container"><div class="project"><div class="horizontal-logos"><img src="assets/logos/ford.jpg" alt="Ford"><img src="assets/logos/savant.png" alt="Savant"></div><img src="assets/logos/kitkat.jpg" alt="KitKat"><h3>Ford / Savant / KitKat</h3><p>Contributed to integrated communication pieces and brand adaptation.</p></div></div>`,
      ae: `<h2>Account Executive – JWT</h2><div class="project-container"><div class="project"><div class="horizontal-logos"><img src="assets/logos/kitkat.jpg"><img src="assets/logos/Clight.png"><img src="assets/logos/Movenpick.jpg"><img src="assets/logos/boost.png"></div><h3>Kit Kat, Clight, Movenpick, Boost</h3><p>Management and execution of 360 campaigns for the brands Clight, Kit Kat and Boost for Argentina and Movenpick for Switzerland.</p></div></div>`,
      sr: `<h2>Sr. Account Executive – Nissan United</h2><div class="project-container"><div class="project"><img src="assets/logos/nissan-logo-0-2.png"><h3>Nissan United</h3><p>Digital campaign executions for Nissan Argentina.<br>Leadership in the maintenance and update of Nissan Argentina’s website.<br>Team coordination in the implementation of new technological tools for the website.</p></div></div>`,
      website: `<h2>Website Leader – Nissan United</h2><div class="project-container"><div class="project"><img src="assets/logos/nissan-logo-0-2.png"><h3>Nissan United</h3><p>Team coordination for the maintenance of Nissan’s websites for four markets: Argentina, Chile, Peru and Brazil.<br>Campaigns executions for new releases for the four markets.<br>Technical support on AEM platform for the region.<br>Leadership in the implementation of new technological tools for the websites of all markets.<br>Management of UX/UI projects for the region.</p></div></div>`,
      spm: `<h2>Sr. Project Manager – Grey</h2><div class="project-container"><div class="project"><div class="logo-header"><img src="assets/logos/haleon.jpg" alt="Haleon Logo"><img src="assets/logos/cerveza-modelo-37859.png" alt="Modelo Logo"></div><h3>Haleon / Modelo</h3><p>Oversight and coordination of digital campaigns and communication strategies across all Haleon brands.<br>Daily coordination with regional teams in LATAM, and global teams in the UK and USA.<br>Timeline, scope, and resource management across multiple deliverables and markets.<br>Supervision of content localization, performance tracking, and reporting.<br>Cross-functional collaboration with creative, media and tech teams across time zones.<br>Stakeholder alignment for approvals and project governance.</p><div style="display:flex; flex-wrap:wrap; justify-content:center;"><img src="assets/logos/Sensodyne.png"><img src="assets/logos/parodontax.png"><img src="assets/logos/Pronamel logo.avif"><img src="assets/logos/tums.jpg"><img src="assets/logos/otrivin.avif"><img src="assets/logos/theraflu.webp"></div></div></div>`,
      director: `<h2>Account Director – Grey</h2><div class="project-container"><div class="project"><div class="logo-header"><img src="assets/logos/haleon.jpg" alt="Haleon Logo"><img src="assets/logos/cerveza-modelo-37859.png" alt="Modelo Logo"></div><h3>Haleon / Modelo</h3><p>Senior leadership of the Haleon account across LATAM.<br>Strategic decision-making and consulting for brand development.<br>Relationship management with senior stakeholders in the UK and USA.<br>Revenue growth initiatives, team mentoring, and operational oversight.<br>Integration of global brand strategy with local execution.<br>Management of campaign impact, optimization and innovation roadmap.</p><div style="display:flex; flex-wrap:wrap; justify-content:center;"><img src="assets/logos/Sensodyne.png"><img src="assets/logos/parodontax.png"><img src="assets/logos/Pronamel logo.avif"><img src="assets/logos/tums.jpg"><img src="assets/logos/otrivin.avif"><img src="assets/logos/theraflu.webp"></div></div><div class="project"><img src="assets/logos/world.png" alt="World Logo"><h3>World</h3><p>Strategic direction and campaign execution for World, the new verification and reward platform.<br>Ideation, coordination and launch of the "FOMO" campaign in public spaces with gamified QR code interaction in Argentina.<br>Influencer activations and merch distribution strategies for user acquisition.</p><p>Additionally, we executed a campaign in Mexico focused on combating online fraud. Using the famous Mexican wrestling character "Místico" as a spokesperson, we filmed a story in which he shares his experience with fake accounts pretending to be him. Through World, users can verify it's truly him behind the account, preventing scams and fraud.</p></div></div>`,
      superside: `<h2>Sr. Creative Project Manager – Superside</h2><div class="project-container"><div class="project wide"><div class="horizontal-logos superside-logos"><img src="assets/logos/dropbox.png" alt="Dropbox"><img src="assets/logos/tastytrade.png" alt="tastytrade"><img src="assets/logos/wikimedia-foundation.png" alt="Wikimedia Foundation"></div><h3>Dropbox / tastytrade / Wikimedia Foundation</h3><p>Creative project management for global accounts, coordinating cross-functional teams across strategy, design, motion, production, approvals, timelines, and delivery.</p><p>Focus on high-visibility digital campaigns, brand systems, event assets, video production, creative exploration, and scalable workflows across multiple stakeholders and time zones.</p></div><div class="project wide"><div class="horizontal-logos superside-logos"><img src="assets/logos/ecovadis.png" alt="EcoVadis"><img src="assets/logos/surveymonkey.png" alt="SurveyMonkey"><img src="assets/logos/rakuten-kobo.png" alt="Rakuten Kobo"></div><h3>EcoVadis / SurveyMonkey / Rakuten Kobo</h3><p>Management of creative production streams for B2B, SaaS, and digital product brands, including AI-assisted imagery, how-to videos, weekly campaign assets, localization, and recurring delivery systems.</p><p>Emphasis on operational clarity, stakeholder alignment, priority management, and consistent delivery across fast-moving creative pipelines.</p></div></div>`
    };

    function showRole(role) {
      const container = document.getElementById('project-content');
      container.style.opacity = 0;
      setTimeout(() => {
        container.innerHTML = content[role] || '<p>Content coming soon.</p>';
        container.style.opacity = 1;
      }, 200);

      const buttons = document.querySelectorAll('.role-buttons button');
      buttons.forEach(btn => btn.classList.remove('active'));
      const activeBtn = document.getElementById(`btn-${role}`);
      if (activeBtn) activeBtn.classList.add('active');
    }

    window.onload = () => {
      showRole('superside');
    };
  </script>
</body>
</html>
